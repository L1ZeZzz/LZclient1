# .github/workflows/build.yml
name: Build Mod

on: 
  push:                 # 当代码推送到任何分支时触发
  pull_request:         # 当有 Pull Request 时触发
  workflow_dispatch:    # 允许你从 GitHub 网页手动触发

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 作为构建环境

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # 1. 拉取你的代码

      - name: Set up JDK 8
        uses: actions/setup-java@v4  # 2. 设置 Java 8 环境
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew      # 3. 给 Gradle 包装脚本添加执行权限

      - name: Build with Gradle
        run: ./gradlew build --no-daemon  # 4. 执行构建命令

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4  # 5. 上传构建产物
        with:
          name: cloudclient-mod-jar
          path: build/libs/*.jar         # 打包生成的 .jar 文件路径